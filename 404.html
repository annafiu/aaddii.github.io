<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="stylesheet" href="main.css">
    <style>
        .not-found-container {
            max-width: 600px;
            margin: 80px auto 100px auto;
            padding: 0 20px;
            text-align: center;
            font-family: var(--font-sans, 'Inter', sans-serif);
        }

        /* Styling untuk ilustrasi personal */
        .error-avatar {
            width: 90px;
            height: 90px;
            margin: 0 auto 1.5rem auto;
            border-radius: 50%;
            overflow: hidden;
            border: 1px solid var(--border-color, #e8e6e0);
            background-color: var(--bg-color, #faf9f6);
            opacity: 0.85;
            transition: opacity 0.3s ease;
        }

        .error-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Efek agar selaras dengan nuansa hitam-putih line art */
            filter: grayscale(100%);
        }

        .error-avatar:hover {
            opacity: 1;
        }

        .error-code {
            font-family: var(--font-serif, 'DM Serif Display', serif);
            font-size: 5rem;
            font-weight: 400;
            color: var(--text-muted, #6e6e6e);
            line-height: 1;
            margin-bottom: 1.2rem;
            letter-spacing: -0.02em;
        }

        .error-message {
            font-size: 1.25rem;
            color: var(--text-main, #111111);
            margin-bottom: 0.75rem;
            font-weight: 400;
        }

        .error-description {
            font-size: 0.9rem;
            color: var(--text-muted, #6e6e6e);
            margin-bottom: 2.5rem;
        }

        .btn-home {
            display: inline-block;
            background: none;
            border: 1px solid var(--text-main, #111111);
            color: var(--text-main, #111111);
            padding: 0.75rem 1.5rem;
            font-family: var(--font-mono, 'Courier Prime', monospace);
            font-size: 0.85rem;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border-radius: 4px;
        }

        .btn-home:hover {
            background-color: var(--text-main, #111111);
            color: var(--bg-color, #faf9f6);
        }
    </style>
</head>
<body>

    <div class="not-found-container">
        <!-- Ilustrasi Personal -->
        <div class="error-avatar">
            <img src="https://raw.githubusercontent.com/annafiu/aaddii.github.io/refs/heads/main/assets/img/aaddii.webp" alt="Aaddii">
        </div>

        <div class="error-code">404</div>
        <div class="error-message">the page you are looking for does not exist.</div>
        <div class="error-description">the link might be broken, or the structural path has been updated or relocated.</div>
        <a href="/" class="btn-home">&larr; back to homepage</a>
    </div>

</body>
</html>
